plugins {
    id 'java'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
    id 'com.azuredoom.hytale-tools' version '1.0.38'
}

dependencies {
    compileOnly 'curse.maven:hexcode-1448311:8166165'
}

hytaleTools {
    manifestGroup = 'org.MoreMagicSpell'
    modCredits = 'Im404,Rirpod'
    patchline = 'release'
    modId = 'More_Magic_Spell'
    mainClass = 'org.MoreMagicSpell.MoreMagicSpell'
    manifestOptionalDependencies='Riprod:Hexcode=^0.8.5,Riprod:Patchly=*'

    injectServerJavadocsIntoSources = true
}  